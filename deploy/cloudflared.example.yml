# Konfiguracija Cloudflare Tunnel-a na serveru: /etc/cloudflared/config.yml
# Credentials fajl tunela ide pored nje, u /etc/cloudflared/ (chmod 600).
# Posle izmene: sudo systemctl restart cloudflared
#
#   cloudflared tunnel create dani90          -> ispisuje UUID i credentials fajl
#   cloudflared tunnel route dns dani90 app.dani90.rs
#   sudo cloudflared service install          -> servis koji čita ovaj fajl

tunnel: ZAMENI-SA-UUID-TUNELA
credentials-file: /etc/cloudflared/ZAMENI-SA-UUID-TUNELA.json

ingress:
  - hostname: app.dani90.rs
    service: http://localhost:8080
  # Sve ostalo se odbija — bez ovog pravila cloudflared ne startuje.
  - service: http_status:404
